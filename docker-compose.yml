services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: neighborly
      POSTGRES_USER: neighborly
      POSTGRES_PASSWORD: neighborly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - neighborly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighborly -d neighborly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    # Rate-limit counters are not source-of-truth data. AOF keeps them across a local restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - neighborly-redis:/data

  # Staging profile. Does not replace the dev Postgres and Redis services above.
  # Start with: scripts/staging-up.sh
  # Local fixture passwords in this profile are not production secrets.
  staging-postgres:
    profiles: ["staging"]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: neighborly
      POSTGRES_USER: neighborly
      POSTGRES_PASSWORD: neighborly
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - neighborly-staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighborly -d neighborly"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  staging-redis:
    profiles: ["staging"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - neighborly-staging-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  # Staging object store. Same image and S3 API shape as the storage CI job
  # and scripts/run-storage-tests.sh: rustfs/rustfs:1.0.1, port 9000, path-style
  # calls, and GET /minio/health/live. Do not set a command. The image
  # entrypoint reads RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY; a MinIO
  # `server /data` argument never listens.
  # The Compose service name stays `minio` so S3_ENDPOINT=http://minio:9000
  # in env.staging.example keeps resolving. The access keys and bucket name
  # stay the staging fixtures, not the disposable CI test keys.
  # The named volume is kept. The image user is 10001 and cannot write a
  # root-owned Docker volume, so this process runs as root. Do not delete
  # the volume to change that ownership.
  minio:
    profiles: ["staging"]
    image: rustfs/rustfs:1.0.1
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: neighborly-staging
      RUSTFS_SECRET_KEY: neighborly-staging-local-only
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - neighborly-staging-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  minio-init:
    profiles: ["staging"]
    image: neighborly-api:staging
    build:
      context: .
      dockerfile: deploy/staging/api.Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: neighborly-media
      S3_ACCESS_KEY_ID: neighborly-staging
      S3_SECRET_ACCESS_KEY: neighborly-staging-local-only
    entrypoint: ["node"]
    command:
      - "-e"
      - |
        const { S3Client, CreateBucketCommand } = require("@aws-sdk/client-s3")
        const client = new S3Client({
          region: "us-east-1",
          endpoint: process.env.S3_ENDPOINT_URL,
          forcePathStyle: true,
          credentials: {
            accessKeyId: process.env.S3_ACCESS_KEY_ID,
            secretAccessKey: process.env.S3_SECRET_ACCESS_KEY
          }
        })
        client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET_NAME }))
          .then(() => process.stdout.write("bucket ready\n"))
          .catch(error => {
            if (error.name === "BucketAlreadyOwnedByYou" || error.name === "BucketAlreadyExists") {
              process.stdout.write("bucket ready\n")
            } else {
              process.stderr.write(String(error) + "\n")
              process.exit(1)
            }
          })
    restart: "no"
  staging-migrate:
    profiles: ["staging"]
    image: neighborly-api:staging
    build:
      context: .
      dockerfile: deploy/staging/api.Dockerfile
    env_file:
      - .env.staging
    command: ["/app/db-setup.sh"]
    depends_on:
      staging-postgres:
        condition: service_healthy
    restart: "no"
  api:
    profiles: ["staging"]
    image: neighborly-api:staging
    build:
      context: .
      dockerfile: deploy/staging/api.Dockerfile
    env_file:
      - .env.staging
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      staging-migrate:
        condition: service_completed_successfully
      staging-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  web:
    profiles: ["staging"]
    image: neighborly-web:staging
    build:
      context: .
      dockerfile: deploy/staging/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://staging.neighborly.localhost:8444/api/v1}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  caddy:
    profiles: ["staging"]
    image: neighborly-caddy:staging
    build:
      context: .
      dockerfile: deploy/staging/proxy.Dockerfile
    ports:
      - "127.0.0.1:8444:8444"
    volumes:
      - neighborly-staging-caddy:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-kfsS",
          "--resolve",
          "staging.neighborly.localhost:8444:127.0.0.1",
          "https://staging.neighborly.localhost:8444/api/v1/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  neighborly-postgres:
  neighborly-redis:
  neighborly-staging-postgres:
  neighborly-staging-redis:
  neighborly-staging-minio:
  neighborly-staging-caddy:
