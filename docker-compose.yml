services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: neighborly
      POSTGRES_USER: neighborly
      POSTGRES_PASSWORD: neighborly
    ports:
      - "5432:5432"
    volumes:
      - neighborly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighborly -d neighborly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - neighborly-redis:/data

volumes:
  neighborly-postgres:
  neighborly-redis:
