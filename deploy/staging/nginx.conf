server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # The web image does not serve the API. Caddy sends /api and /socket.io
    # to the API container. A request that still lands here must not become
    # the SPA shell.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        default_type text/plain;
        return 404 "not found\n";
    }

    location ^~ /socket.io/ {
        default_type text/plain;
        return 404 "not found\n";
    }

    # Hashed build files. A missing asset stays 404 so the browser does not
    # treat index.html as JavaScript or CSS.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|json|txt|xml|webmanifest)$ {
        try_files $uri =404;
    }

    # History API routes (/listings/:id, /requests/:id, and the rest of
    # src/lib/paths.ts). Unknown extensionless paths return the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
