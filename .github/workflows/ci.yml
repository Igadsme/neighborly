name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.34.3

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://neighborly:neighborly@localhost:5432/neighborly
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E marketplace journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://neighborly:neighborly@localhost:5432/neighborly
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: qa-only-access-secret-with-more-than-32-characters
      JWT_REFRESH_SECRET: qa-only-refresh-secret-with-more-than-32-characters
      CORS_ORIGIN: http://127.0.0.1:4173
      APP_URL: http://127.0.0.1:4173
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: neighborly-media
      S3_ACCESS_KEY: neighborly
      S3_SECRET_KEY: neighborly-local-storage-secret
      S3_PUBLIC_URL: http://127.0.0.1:9000/neighborly-media
      S3_FORCE_PATH_STYLE: true
      S3_AUTO_CREATE_BUCKET: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: docker compose up -d --wait postgres redis minio
      - run: pnpm exec prisma migrate deploy && pnpm exec prisma db seed
        working-directory: backend
      - run: pnpm build
        working-directory: backend
      - run: nohup pnpm start > /tmp/neighborly-api.log 2>&1 &
        working-directory: backend
      - run: for i in {1..30}; do curl -fsS http://127.0.0.1:3000/api/v1/health && exit 0; sleep 1; done; exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke
        working-directory: backend
      - run: pnpm test:frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/neighborly-api.log
            playwright-report/
            test-results/
          if-no-files-found: ignore

  security:
    name: Security authorization and abuse controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://neighborly:neighborly@localhost:5432/neighborly
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: qa-only-access-secret-with-more-than-32-characters
      JWT_REFRESH_SECRET: qa-only-refresh-secret-with-more-than-32-characters
      CORS_ORIGIN: http://127.0.0.1:4173
      RATE_LIMIT_MAX: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: docker compose up -d --wait postgres redis
      - run: pnpm exec prisma migrate deploy && pnpm exec prisma db seed
        working-directory: backend
      - run: pnpm build && nohup pnpm start > /tmp/neighborly-security-api.log 2>&1 &
        working-directory: backend
      - run: for i in {1..30}; do curl -fsS http://127.0.0.1:3000/api/v1/health && exit 0; sleep 1; done; exit 1
      - run: pnpm test:security
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: security-artifacts, path: /tmp/neighborly-security-api.log, if-no-files-found: ignore }

  backend-integration:
    name: Backend migrations and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: neighborly, POSTGRES_USER: neighborly, POSTGRES_PASSWORD: neighborly }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U neighborly -d neighborly"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://neighborly:neighborly@localhost:5432/neighborly
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm exec prisma migrate deploy && pnpm exec prisma validate && pnpm exec prisma generate
        working-directory: backend
      - run: pnpm test -- --coverage
        working-directory: backend
      - run: pnpm build
        working-directory: backend
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage/, if-no-files-found: ignore }

  devops:
    name: DevOps Docker health and restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/devops-smoke.sh
      - if: always()
        run: docker compose -p "neighborly-qa-${GITHUB_RUN_ID}" -f docker-compose.yml logs --no-color > /tmp/neighborly-docker.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: devops-logs, path: /tmp/neighborly-docker.log, if-no-files-found: ignore }
